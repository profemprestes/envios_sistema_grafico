<script type="text/babel">
// Rutas del sitio real -> pantalla + variante. `go("/servicios/enviosflex")` navega.
const ROUTES = {
  "/": ["home"],
  "/servicios/envios-express": ["servicio", "express"],
  "/servicios/envios-lowcost": ["servicio", "lowcost"],
  "/servicios/enviosflex": ["servicio", "flex"],
  "/servicios/plan-emprendedores": ["servicio", "emprendedores"],
  "/cotizar/express": ["cotizar", "express"],
  "/cotizar/lowcost": ["cotizar", "lowcost"],
  "/contacto": ["contacto"],
  "/nosotros/sobre-nosotros": ["nosotros"],
  "/nosotros/preguntas-frecuentes": ["faq"],
  "/nosotros/nuestras-redes": ["redes"],
  "/terminos-y-condiciones": ["legal", "terminos"],
  "/politica-de-privacidad": ["legal", "privacidad"],
};
function App() {
  const initial = ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : "/";
  const [path, setPath] = React.useState(initial);
  const go = (p) => { if (!ROUTES[p]) return; setPath(p); history.replaceState(null, "", "#" + p); window.scrollTo(0, 0); };
  const [screen, variant] = ROUTES[path];
  return (
    <div className="min-h-screen flex flex-col">
      <Navbar path={path} go={go} />
      <main className="flex-1">
        {screen === "home" && <HomeScreen go={go} />}
        {screen === "servicio" && <ServicioScreen key={variant} service={variant} go={go} />}
        {screen === "cotizar" && <CotizarScreen key={variant} mode={variant} go={go} />}
        {screen === "contacto" && <ContactoScreen go={go} />}
        {screen === "nosotros" && <NosotrosScreen go={go} />}
        {screen === "faq" && <FaqScreen go={go} />}
        {screen === "redes" && <RedesScreen go={go} />}
        {screen === "legal" && <LegalScreen key={variant} doc={variant} go={go} />}
      </main>
      <RedesStrip />
      <Footer go={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
